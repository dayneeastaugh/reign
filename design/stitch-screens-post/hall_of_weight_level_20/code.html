<script>
          const regions = [
            'R1', 'R1', 'R1', 'R2', 'R2', 'R2',
            'R1', 'R1', 'R1', 'R3', 'R5', 'R5',
            'R4', 'R4', 'R4', 'R3', 'R5', 'R5',
            'R4', 'R4', 'R4', 'R3', 'R6', 'R6',
            'R7', 'R7', 'R7', 'R7', 'R6', 'R6',
            'R7', 'R7', 'R7', 'R7', 'R6', 'R6'
          ];
          
          for(let i = 0; i < 36; i++) {
            const isCrown = [3, 8, 14, 21, 29, 30].includes(i);
            const isMark = [0, 5, 12, 17, 24, 35].includes(i);
            
            let content = '';
            let contentClass = '';
            
            if (isCrown) {
              content = '✜';
              contentClass = 'text-primary text-3xl font-bold opacity-90 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)] mix-blend-multiply scale-[0.8] animate-[bounce_0.5s_ease-out]';
            } else if (isMark) {
              content = '×';
              contentClass = 'text-outline text-xl opacity-40 mix-blend-multiply';
            }
            
            document.write(`
              <button class="relative z-20 flex items-center justify-center border-r-[3px] border-b-[3px] border-[#3f3a33]/10 active:bg-black/5 transition-colors duration-200">
                <span class="${contentClass}">${content}</span>
              </button>
            `);
          }
