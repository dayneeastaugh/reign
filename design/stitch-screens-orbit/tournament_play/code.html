<style>
    /* Letterpress & Skeuomorphic Depth */
    .deboss-board {
      box-shadow: inset 0px 2px 8px rgba(0, 0, 0, 0.4), inset 0px 1px 3px rgba(0,0,0,0.5);
    }
    .card-shadow {
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(255,255,255,0.05) inset;
    }
    .pill-shadow {

      transform: scale(0.96);
      box-shadow: none;
    }
    
    /* Station Interior Palette (Steel & Brass) */
    .theme-station {
      --bg-color: #0c081f; /* Deep Space Navy */
      --board-bg: #1a1530;
      --board-border: #4a4563; /* Steel lines */
      --cell-border: rgba(120, 110, 150, 0.2);
      
      /* Region Colors - Metallic Wash */
      --region-1: #242938; /* Gunmetal */
      --region-2: #2d2633; /* Aubergine Steel */
      --region-3: #1f3033; /* Deep Cyan Steel */
      --region-4: #332b26; /* Tarnished Brass */
      --region-5: #2d3330; /* Pale Verdigris */
      
      --symbol-color: #ffd700; /* Gold/Brass Gear */
      --mark-color: #6a6485;
      
      --text-main: #f0e6d2; /* Cream */
      --text-muted: #8c86a8;
      
      --accent: #d4af37; /* Metallic Gold */
    }

    /* Rust World Palette (Warm Wash) - For Demonstration */
    .theme-rust {
      --bg-color: #2b110a; /* Deep Rust */
      --board-bg: #3d1b11;
      --board-border: #803d24;
      --cell-border: rgba(160, 80, 50, 0.2);
      
      --region-1: #4a2115;
      --region-2: #542b1a;
      --region-3: #4d2618;
      --region-4: #5c3220;
      --region-5: #451a0f;
      
      --symbol-color: #e67e22; /* Oxidized Copper */
      --mark-color: #8f533b;
      
      --text-main: #f5d0b5;
      --text-muted: #ab7a65;
      
      --accent: #e67e22;
    }

    /* Apply CSS variables based on active class */
    .playfield-active-theme {
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    /* Grid Styles */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 0;
      aspect-ratio: 1/1;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border: 3px solid var(--board-border);
      border-radius: 8px;
      background-color: var(--board-bg);
      position: relative;
      overflow: hidden;
    }

    .cell {
      position: relative;
      border-right: 1px solid var(--cell-border);
      border-bottom: 1px solid var(--cell-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .cell:nth-child(6n) { border-right: none; }
    .cell:nth-last-child(-n+6) { border-bottom: none; }

    /* Thick borders for regions (simulated via absolute overlays for complex shapes or applied to cells) */
    .region-border-r { border-right: 3px solid var(--board-border) !important; }
    .region-border-b { border-bottom: 3px solid var(--board-border) !important; }
    
    .bg-r1 { background-color: var(--region-1); }
    .bg-r2 { background-color: var(--region-2); }
    .bg-r3 { background-color: var(--region-3); }
    .bg-r4 { background-color: var(--region-4); }
    .bg-r5 { background-color: var(--region-5); }

    /* Symbols */
    .symbol-gear {
      color: var(--symbol-color);
      font-size: 28px;
      font-variation-settings: 'FILL' 1;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
      opacity: 0;
      transform: scale(1.5);
    }
    
    .symbol-mark {
      color: var(--mark-color);
      font-size: 20px;
      opacity: 0;
      transform: scale(0.8);
    }

    /* Animations */
    .stamp-in {
      animation: stamp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    @keyframes stamp {
      0% { opacity: 0; transform: scale(1.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    .mark-in {
      animation: markfade 0.2s ease-out forwards;
    }
    
    @keyframes markfade {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Overlay Glass */
    .glass-overlay {
      background: rgba(12, 8, 31, 0.7);
      backdrop-filter: blur(12px) scale(1.02);
      -webkit-backdrop-filter: blur(12px) scale(1.02);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* Stitch Border for Pills */
    .stitch-border {
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
    }

<script>
    // Theme Toggling Logic
    const themeWrapper = document.getElementById('theme-wrapper');
    const themeToggleBtn = document.getElementById('theme-toggle');
    let isRustTheme = false;

    themeToggleBtn.addEventListener('click', () => {
      isRustTheme = !isRustTheme;
      if (isRustTheme) {
        themeWrapper.classList.remove('theme-station');
        themeWrapper.classList.add('theme-rust');
      } else {
        themeWrapper.classList.remove('theme-rust');
        themeWrapper.classList.add('theme-station');
      }
    });

    // Tool Selection Logic
    let currentTool = 'gear'; // 'gear' or 'mark'
    const btnGear = document.getElementById('btn-gear');
    const btnMark = document.getElementById('btn-mark');

    btnGear.addEventListener('click', () => {
      currentTool = 'gear';
      btnGear.classList.add('bg-[var(--accent)]', 'text-[#1a1a1a]');
      btnGear.classList.remove('bg-[rgba(255,255,255,0.05)]', 'text-[var(--text-muted)]');
      
      btnMark.classList.remove('bg-[var(--accent)]', 'text-[#1a1a1a]');
      btnMark.classList.add('bg-[rgba(255,255,255,0.05)]', 'text-[var(--text-muted)]');
    });

    btnMark.addEventListener('click', () => {
      currentTool = 'mark';
      btnMark.classList.add('bg-[var(--accent)]', 'text-[#1a1a1a]');
      btnMark.classList.remove('bg-[rgba(255,255,255,0.05)]', 'text-[var(--text-muted)]');
      
      btnGear.classList.remove('bg-[var(--accent)]', 'text-[#1a1a1a]');
      btnGear.classList.add('bg-[rgba(255,255,255,0.05)]', 'text-[var(--text-muted)]');
    });

    // Cell Interaction Logic
    let cellsPlaced = 0;
    const totalToWin = 3; // Trigger win after 3 placements for demo

    window.toggleCell = function(cell) {
      // Clear existing content
      if (cell.innerHTML.trim() !== '') {
        cell.innerHTML = '';
        cellsPlaced--;
        return;
      }

      if (currentTool === 'gear') {
        cell.innerHTML = `<span class="material-symbols-outlined symbol-gear stamp-in">settings</span>`;
        // Trigger haptic feedback (simulation)
        if (navigator.vibrate) navigator.vibrate(15);
      } else {
        cell.innerHTML = `<span class="material-symbols-outlined symbol-mark mark-in">close</span>`;
      }

      cellsPlaced++;
      
      // Simulate win condition
      if (cellsPlaced >= totalToWin) {
        setTimeout(showSolvedState, 500);
      }
    };

    // Solved State Logic
    const solvedOverlay = document.getElementById('solved-overlay');
    const starsContainer = document.getElementById('stars-container');
    const stampContainer = document.getElementById('stamp-container');
    const actionContainer = document.getElementById('action-container');

    function showSolvedState() {
      solvedOverlay.classList.remove('pointer-events-none', 'opacity-0');
      solvedOverlay.classList.add('opacity-100');
      
      // Animate elements in
      requestAnimationFrame(() => {
        starsContainer.classList.remove('translate-y-8', 'opacity-0');
        stampContainer.classList.remove('translate-y-8', 'opacity-0');
        actionContainer.classList.remove('translate-y-8', 'opacity-0');
      });
    }

    window.hideSolvedState = function() {
      solvedOverlay.classList.remove('opacity-100');
      solvedOverlay.classList.add('opacity-0', 'pointer-events-none');
      
      starsContainer.classList.add('translate-y-8', 'opacity-0');
      stampContainer.classList.add('translate-y-8', 'opacity-0');
      actionContainer.classList.add('translate-y-8', 'opacity-0');
      
      // Reset board for demo
      document.querySelectorAll('.cell').forEach(c => c.innerHTML = '');
      cellsPlaced = 0;
    };
    
    // Timer simulation
    let seconds = 74;
    const timerDisplay = document.getElementById('timer');
    setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${mins}:${secs}`;
    }, 1000);

  </script>
