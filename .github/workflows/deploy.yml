name: Deploy Reign

on:
  push:
    branches: [main]
  workflow_dispatch:

# Content and engine are validated before anything reaches the site: a puzzle
# that isn't unique, isn't logic-solvable, or lies about its difficulty must
# never ship.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Engine tests
        run: npm test

      - name: Validate tournament content
        run: npm run content:validate

      - name: Build
        run: npm run build -w @reign/game

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
